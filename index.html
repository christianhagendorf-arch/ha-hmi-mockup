<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HA HMI Mockup</title>
    
    <link rel="icon" href="data:,">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
    >

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/modal.css">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="header-title">
                <h1>Zuhause</h1>

                <span class="header-subtitle">
                    Alle Etagen im Blick
                </span>
            </div>

            <button
                type="button"
                id="theme-toggle"
                class="theme-toggle"
                aria-label="Farbschema umschalten"
                title="Farbschema umschalten"
            >
                <i
                    id="theme-icon"
                    class="mdi mdi-weather-sunny"
                    aria-hidden="true"
                ></i>

                <span id="theme-label">
                    Hell
                </span>
            </button>
        </div>
    </header>

    <main id="app"></main>

    <div
        id="room-modal"
        class="modal"
        hidden
    >
        <div
            class="modal-backdrop"
            data-action="close-modal"
        ></div>

        <section
            class="modal-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title"
        >
            <header class="modal-header">
                <div>
                    <div class="modal-eyebrow">
                        Raumdetails
                    </div>

                    <h2 id="modal-title">
                        Raum
                    </h2>
                </div>

                <button
                    type="button"
                    class="modal-close"
                    data-action="close-modal"
                    aria-label="Raumdetails schließen"
                    title="Schließen"
                >
                    <i class="mdi mdi-close"></i>
                </button>
            </header>

            <div
                id="modal-content"
                class="modal-content"
            ></div>
        </section>
    </div>

    <script
        type="module"
        src="./src/theme.js"
    ></script>

    <script
        type="module"
        src="./src/app.js"
    ></script>
</body>

</html>
